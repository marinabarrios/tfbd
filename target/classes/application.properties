# Configuración de la base de datos
spring.datasource.url=jdbc:mysql://localhost:3306/tfbd?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=mysql
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración adicional del pool de conexiones
spring.datasource.hikari.pool-name=HikariCP
spring.datasource.hikari.maximum-pool-size=10

#Crea las tablas desde cero cada vez que se inicia la aplicación (borra datos existentes).
spring.jpa.hibernate.ddl-auto=create

# Dialecto de Hibernate para MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
#spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Muestra las consultas SQL en la consola durante la ejecución de la aplicación
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Nivel de log para toda la aplicación
#logging.level.root=INFO

# Configuración específica para paquetes
#logging.level.org.springframework=WARN
#logging.level.com.example=DEBUG

# Formato de salida en consola
#logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Archivo de log (opcional)
logging.file.name=logs/application.log

# Para obtener más detalles sobre lo que está fallando al cargar el contexto
#logging.level.org.springframework=DEBUG
#logging.level.org.hibernate=DEBUG
#logging.level.com.example=DEBUG
logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.type.descriptor.sql=TRACE
#logging.level.org.springframework.jdbc.datasource=DEBUG
logging.level.com.zaxxer.hikari=DEBUG